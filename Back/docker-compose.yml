services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: asistencia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [mysqr-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks: [mysqr-network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  traefik:
    image: traefik:v2.10
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=mysqr-network"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:8088"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "8088:8088"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [mysqr-network]

  database:
    build: &build
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: database
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.database.entrypoints=websecure"
      - "traefik.http.routers.database.rule=PathPrefix(`/api/db`)"
      - "traefik.http.services.database.loadbalancer.server.port=8084"
    ports:
      - "8084:8084"
    environment: &db-env
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: asistencia_db
      DB_SSLMODE: disable
    networks: [mysqr-network]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  qr:
    build:
      <<: *build
      args:
        SERVICE: qr
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qr.entrypoints=websecure"
      - "traefik.http.routers.qr.rule=PathPrefix(`/api/qr`)"
      - "traefik.http.middlewares.qr-strip.stripprefix.prefixes=/api/qr"
      - "traefik.http.routers.qr.middlewares=qr-strip"
      - "traefik.http.services.qr.loadbalancer.server.port=8087"
    ports:
      - "8087:8087"
    environment:
      <<: *db-env
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks: [mysqr-network]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  teacher:
    build:
      <<: *build
      args:
        SERVICE: teacher
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.teacher.entrypoints=websecure"
      - "traefik.http.routers.teacher.rule=PathPrefix(`/api/classes`)"
      - "traefik.http.services.teacher.loadbalancer.server.port=8086"
    ports:
      - "8086:8086"
    environment:
      <<: *db-env
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks: [mysqr-network]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  student:
    build:
      <<: *build
      args:
        SERVICE: student
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.student.entrypoints=websecure"
      - "traefik.http.routers.student.rule=PathPrefix(`/api/scan`)"
      - "traefik.http.services.student.loadbalancer.server.port=8085"
    ports:
      - "8085:8085"
    environment:
      <<: *db-env
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks: [mysqr-network]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

networks:
  mysqr-network:
    driver: bridge

volumes:
  postgres_data:
